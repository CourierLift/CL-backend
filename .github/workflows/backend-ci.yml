name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - launch-readiness
      - transaction-core-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CL_APP_ENV: test
      CL_DATABASE_URL: "sqlite:///:memory:"
      CL_SECRET_KEY: ci-only-secret-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify application import
        run: python -c "from backend.main import app; print(app.title)"

      - name: Verify migration baseline
        env:
          CL_DATABASE_URL: "sqlite:///./migration-ci.db"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          rm -f migration-ci.db

      - name: Compile source and tests
        run: python -m compileall -q backend tests migrations

      - name: Run test suite
        run: python -m pytest -q

  postgres:
    name: PostgreSQL transaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: courier_lifts_test
          POSTGRES_USER: courier_lifts
          POSTGRES_PASSWORD: courier_lifts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier_lifts -d courier_lifts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CL_APP_ENV: test
      # Exercise the provider URL format used by Render, including normalization
      # to the installed psycopg 3 driver in the application and migrations.
      CL_DATABASE_URL: "postgresql://courier_lifts:courier_lifts@localhost:5432/courier_lifts_test"
      CL_SECRET_KEY: ci-only-secret-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Compile source and tests
        run: python -m compileall -q backend tests migrations

      - name: Run full suite on PostgreSQL
        run: python -m pytest -q

  recovery-runtime:
    name: Backup container and native recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Build the backup and recovery runtime
        run: docker build --file ops/pilot-recovery/Dockerfile --tag cl-pilot-backup-ci .
      - name: Exercise real PostgreSQL and age with synthetic S3 only
        run: docker run --rm --network none cl-pilot-backup-ci /bin/sh ops/pilot-recovery/ci_native_drill.sh
      - name: Record the isolated image identity
        run: docker image inspect cl-pilot-backup-ci --format '{{.Id}}'

  native-web-recovery-build:
    name: Native Render build and exact legacy runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pilot_backup_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot_backup_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CL_APP_ENV: test
      CL_DATABASE_URL: "sqlite:///:memory:"
      CL_BACKUP_TEST_ADMIN_URL: "postgresql://pilot_backup_test:synthetic-ci-only@127.0.0.1:5432/postgres"
      CL_BACKUP_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      CL_BACKUP_TEST_AGE_BIN: ${{ github.workspace }}/.pilot-recovery/bin/age
      CL_LEGACY_TEST_RUNTIME: ${{ github.workspace }}/.pilot-recovery
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Set up the native Render candidate interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"
      - name: Install PostgreSQL 16 client for the isolated drill
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Execute the actual reviewed native build command
        run: pip install -r requirements.txt && python scripts/prepare_release_runtime.py
      - name: Verify exact old source and runtime with restored SQLite only
        run: python -m pytest -q tests/test_legacy_runtime_native.py
