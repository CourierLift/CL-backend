name: Courier Lifts AWS access check
on:
  push:
    branches: [ops/courier-pilot-aws]
  workflow_dispatch:

permissions: {}
jobs:
  verify:
    if: github.repository_id == '1051003659' && github.ref == 'refs/heads/ops/courier-pilot-aws'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      id-token: write
    env:
      AWS_REGION: us-west-2
      PILOT_ROLE: ${{ secrets.COURIERLIFTS_PILOT_VERIFIER_ARN }}
    steps:
      - name: Identify this workflow for the AWS trust policy
        shell: python
        run: |
          import base64, json, os, urllib.request
          from urllib.parse import urlencode
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&' + urlencode({'audience': 'sts.amazonaws.com'})
          headers = {'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
              payload = json.load(response)['value'].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          assert claims['iss'] == 'https://token.actions.githubusercontent.com'
          assert claims['aud'] == 'sts.amazonaws.com' and claims['repository_id'] == '1051003659'
          assert claims['repository_owner_id'] == '220552329'
          assert claims['ref'] == 'refs/heads/ops/courier-pilot-aws'
          print('AWS trust subject:', claims['sub'])
          if not os.environ.get('PILOT_ROLE'):
              raise SystemExit('AWS verifier role is missing; storage and email were not verified.')
      - name: Use short-lived AWS credentials
        if: env.PILOT_ROLE != ''
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          aws-region: us-west-2
          role-to-assume: ${{ env.PILOT_ROLE }}
          role-session-name: courier-pilot-status
          role-duration-seconds: 900
          mask-aws-account-id: true
          retry-max-attempts: 2
      - name: Verify the three existing pilot buckets in place
        if: env.PILOT_ROLE != ''
        shell: bash
        run: |
          set -euo pipefail
          export AWS_PAGER=''
          account=$(aws sts get-caller-identity --query Account --output text)
          # Pin the approved account without publishing its number in this workflow.
          [[ $(printf '%s' "$account" | sha256sum | cut -d' ' -f1) == '0c1cd7cd574f8ca2db5c944758697862db2756376e8ba7769a1a1f24cc5eb035' ]] || { echo 'Unexpected AWS account.'; exit 1; }
          # Existing buckets were approved for use in place. No storage stack or import is required.
          for purpose in proofs backups recovery; do
            bucket="courierlifts-pilot-$purpose-$account-us-west-2"
            opts=(--bucket "$bucket" --expected-bucket-owner "$account" --region us-west-2 --output json)
            echo "Checking $purpose bucket settings."
            aws s3api get-bucket-versioning "${opts[@]}" | jq -e '.Status == "Enabled"' >/dev/null
            aws s3api get-public-access-block "${opts[@]}" | jq -e '.PublicAccessBlockConfiguration | [.BlockPublicAcls, .IgnorePublicAcls, .BlockPublicPolicy, .RestrictPublicBuckets] | all(. == true)' >/dev/null
            aws s3api get-bucket-encryption "${opts[@]}" | jq -e '.ServerSideEncryptionConfiguration.Rules | (type == "array" and length > 0 and all(.[]; .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "AES256"))' >/dev/null
            echo "PASS: $purpose has public access blocks, versioning and AES256 enabled."
          done
      - name: Verify the pilot email sender separately
        if: env.PILOT_ROLE != ''
        shell: bash
        run: |
          set -euo pipefail
          export AWS_PAGER=''
          sender=$(aws cloudformation describe-stacks --stack-name courierlifts-pilot-verifier-v1 --query "Stacks[0].Parameters[?ParameterKey=='PilotSender'].ParameterValue | [0]" --output text)
          [[ -n "$sender" && "$sender" != None ]] || { echo 'Sender identity is not configured.'; exit 1; }
          aws sesv2 get-email-identity --email-identity "$sender" --region us-west-2 --output json | jq -e '.VerifiedForSendingStatus == true' >/dev/null
          echo 'PASS: SES sender verified. Message delivery is a separate test.'
